spring:
  application:
    name: theater_proj
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    properties:
      hibernate:
        # show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
  h2:
    console:
      settings:
        web-allow-others: true
      enabled: true

logging.level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: "theaterprojectsecretkey1234theaterprojectsecretkey1234theaterprojectsecretkey1234"
  access-token-expiration-ms: 360000
  refresh-token-expiration-ms: 1209600000
server:
  port: 8088
